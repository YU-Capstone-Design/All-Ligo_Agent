<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marketing AI Agent Test Page</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #0f172a;
            --panel: rgba(15, 23, 42, 0.86);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #fbbf24;
            --accent-2: #22c55e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top, rgba(251, 191, 36, 0.25), transparent 30%),
                radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.18), transparent 24%),
                linear-gradient(135deg, #020617, #0f172a 55%, #111827);
        }
        .card {
            width: min(720px, calc(100vw - 32px));
            padding: 32px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 20px;
            background: var(--panel);
            box-shadow: 0 24px 80px rgba(2, 6, 23, 0.5);
        }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(251, 191, 36, 0.12);
            color: var(--accent);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        h1 {
            margin: 16px 0 12px;
            font-size: clamp(32px, 6vw, 56px);
            line-height: 1.05;
        }
        p {
            margin: 0 0 14px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.7;
        }
        .meta {
            display: grid;
            gap: 10px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.16);
            font-size: 15px;
        }
        .meta code {
            color: #fff;
            background: rgba(15, 23, 42, 0.8);
            padding: 2px 8px;
            border-radius: 8px;
        }
        a {
            color: var(--accent);
            text-decoration: none;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            color: #d1fae5;
            font-weight: 600;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-2);
            box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.12);
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="badge">External test page</span>
        <h1>FastAPI 서버 접속 확인 페이지</h1>
        <p>이 페이지가 보이면 서버가 실행 중이고, HTTP 접속이 가능한 상태입니다.</p>
        <p>브라우저에서 이 주소를 열어 확인하세요. 같은 네트워크 밖에서 접속하려면 포트 포워딩이나 터널이 추가로 필요합니다.</p>
        <div class="status"><span class="dot"></span>Server is reachable</div>
        <div class="meta">
            <div>테스트 엔드포인트: <code>/</code></div>
            <div>API 문서: <a href="/docs">/docs</a></div>
            <div>정적 파일: <a href="/static">/static</a></div>
        </div>
    </main>
</body>
</html>
